# Redirección de HTTP a HTTPS
# Limitación de peticiones (DDoS)
limit_req_zone $binary_remote_addr zone=one:10m rate=50r/s;

server {

    listen 80;
    server_name _;
    
    location / {
        return 308 https://$host$request_uri;
    }
}

# Servidor Principal HTTPS
server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL
    ssl_certificate /etc/nginx/certs/SAMPP.crt;
    ssl_certificate_key /etc/nginx/certs/SAMPP.key;

    # Optimización SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ModSecurity Engine (2025 airween version)
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/include.conf;
    modsecurity_rules '
        SecAction \
        "id:900110, \
        phase:1, \
        nolog, \
        pass, \
        t:none, \
        setvar:tx.inbound_anomaly_score_threshold=20"
        
        SecRuleRemoveById 930130
    ';

    # Aplicar Rate Limit
    limit_req zone=one burst=100 nodelay;


    # Aplicación Principal (PHP-Apache)
    location / {
        proxy_pass http://sampp_www:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # phpMyAdmin
    location /pma/ {
        proxy_pass http://sampp_phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
