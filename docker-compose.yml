services:
    # --- Base de Datos (MariaDB) ---
    sampp_mysql:
        image: mariadb:11.8
        container_name: sampp_mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_USER: ${MYSQL_USER}
        volumes:
            - ./mariadb_data/data:/var/lib/mysql
            - ./docker/phpmyadmin/phpmyadmin.sql:/docker-entrypoint-initdb.d/phpmyadmin.sql:ro
            - ./docker/mariadb/ssl.cnf:/etc/mysql/conf.d/ssl.cnf:ro
            - ./docker/certs:/etc/mysql/ssl:ro
        networks:
            - sampp_network
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 10s
            timeout: 5s
            retries: 5

    # --- phpMyAdmin ---
    sampp_phpmyadmin:
        image: phpmyadmin:5.2
        container_name: sampp_phpmyadmin
        restart: always
        environment:
            PMA_HOST: sampp_mysql
            PMA_ABSOLUTE_URI: https://${DOMAIN}/pma/
        networks:
            - sampp_network
        volumes:
            - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost" ]
            interval: 10s
            timeout: 5s
            retries: 3

    # --- Servidor Web (Apache + PHP) ---
    sampp_www:
        build: ./docker/php
        container_name: sampp_www
        restart: always
        environment:
            - PUBLIC_MAILTRAP_HOST=${PUBLIC_MAILTRAP_HOST}
            - PUBLIC_MAILTRAP_PORT=${PUBLIC_MAILTRAP_PORT}
            - PUBLIC_MAILTRAP_USER=${PUBLIC_MAILTRAP_USER}
            - PUBLIC_MAILTRAP_PASS=${PUBLIC_MAILTRAP_PASS}
            - PUBLIC_CONTACT_FROM_EMAIL=${PUBLIC_CONTACT_FROM_EMAIL}
            - PUBLIC_CONTACT_TO_EMAIL=${PUBLIC_CONTACT_TO_EMAIL}
            - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
            - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE}
            - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
            - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
        volumes:
            - ./www:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
        networks:
            - sampp_network
        healthcheck:
            test: [ "CMD", "curl", "-s", "http://localhost" ]
            interval: 10s
            timeout: 5s
            retries: 3

    # --- Proxy Inverso + WAF (ModSecurity 2025) + IPS (Fail2ban) ---
    sampp_proxy:
        build: ./docker/proxy
        container_name: sampp_proxy
        restart: always
        cap_add:
            - NET_ADMIN
            - NET_RAW
        environment:
            - PARANOIA=${PARANOIA}
        volumes:
            - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/certs:/etc/nginx/certs:ro
            - ./docker/proxy/fail2ban/jail.local:/etc/fail2ban/jail.local:ro
            - ./docker/proxy/fail2ban/filter.d:/etc/fail2ban/filter.d:ro
            - ./logs/proxy:/var/log/nginx
        ports:
            - "80:80"
            - "443:443"
        networks:
            - sampp_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 10s
            timeout: 5s
            retries: 3
        depends_on:
            sampp_www:
                condition: service_healthy
            sampp_phpmyadmin:
                condition: service_healthy

networks:
    sampp_network:
        driver: bridge
